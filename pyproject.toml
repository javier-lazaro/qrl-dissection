[project]
name = "simplyqrl"
version = "0.1.0"
description = "A benchmarking library for hybrid QRL agents"
authors = [
    {name = "Javier Lázaro", email = "javilazaro99@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # Core versions recorded in the historical development environment used
    # for the released paper runs. Keep PennyLane and Lightning aligned.
    "gymnasium==1.0.0",
    "numpy==2.0.2",
    "pennylane==0.40.0",
    "pennylane-lightning==0.40.0",
    "tensorboard==2.19.0",
    "torch==2.6.0",
    "tqdm==4.67.1",
    "autoray==0.7.0",
    "autograd==1.7.0",
]

# Optional dependencies for video recording
[project.optional-dependencies]
video = [
    "imageio>=2.34,<3.0.0",
    "Pillow>=10.3,<11.0.0"
]

[tool.poetry]
packages = [{include = "simplyqrl", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"